name: CI/CD

on:
  push:
    paths:
      - "**.py"
      - "**.ini"
      - "**.toml"
      - "**.lock"
      - ".importlinter"
      - "Dockerfile*"
      - "Makefile"
      - "docker-compose*.yml"
      - ".docker/**"
      - "scenario-tests/**"
      - "renovate.json"
      - "sonar-project.properties"
      - ".sonarcloud.properties"
      - ".github/dependabot.yml"
      - ".github/workflows/workflow.yml"
  pull_request:
    paths:
      - "**.py"
      - "**.ini"
      - "**.toml"
      - "**.lock"
      - ".importlinter"
      - "Dockerfile*"
      - "Makefile"
      - "docker-compose*.yml"
      - ".docker/**"
      - "scenario-tests/**"
      - "renovate.json"
      - "sonar-project.properties"
      - ".sonarcloud.properties"
      - ".github/dependabot.yml"
      - ".github/workflows/workflow.yml"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  hadolint:
    runs-on: ubuntu-latest
    needs: [gitleaks]
    strategy:
      matrix:
        dockerfile: [Dockerfile, Dockerfile.migration]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint ${{ matrix.dockerfile }}
        uses: hadolint/hadolint-action@2a66e89f53d0771bb131a7fa31f3136336094aa6 # v3.4.0
        with:
          dockerfile: ${{ matrix.dockerfile }}
          failure-threshold: warning

  actionlint:
    runs-on: ubuntu-latest
    needs: [hadolint]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint GitHub Actions workflows
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2

  dependency-audit:
    runs-on: ubuntu-latest
    needs: [hadolint]
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: application
            working-directory: .
          - project: scenario-tests
            working-directory: scenario-tests

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.28"

      - name: Audit ${{ matrix.project }} dependencies
        working-directory: ${{ matrix.working-directory }}
        run: uv audit --locked

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: [hadolint]
    permissions:
      contents: read

    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  ruff:
    runs-on: ubuntu-latest
    needs: [hadolint]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Install lint dependencies
        run: uv sync --locked --no-build --group lint --all-packages

      - name: Run Ruff
        run: make lint-ruff

  ty:
    runs-on: ubuntu-latest
    needs: [hadolint]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Install lint and test dependencies
        run: uv sync --locked --no-build --group lint --group test --all-packages

      - name: Run Ty
        run: make lint-ty

  import-linter:
    runs-on: ubuntu-latest
    needs: [hadolint]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Install lint dependencies
        run: uv sync --locked --no-build --group lint --all-packages

      - name: Run Import Linter
        run: make lint-imports

  test:
    runs-on: ubuntu-latest
    needs: [hadolint]
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Install Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked --no-build --python ${{ matrix.python-version }} --group test

      - name: Run unit tests
        run: uv run --locked --no-build --python ${{ matrix.python-version }} --group test pytest -m unit

      - name: Run integration tests
        run: uv run --locked --no-build --python ${{ matrix.python-version }} --group test pytest -m integration

      - name: Run tests with coverage
        run: uv run --locked --no-build --python ${{ matrix.python-version }} pytest --cov=app --cov-report=term-missing --cov-fail-under=80

  build:
    runs-on: ubuntu-latest
    needs: [actionlint, dependency-audit, ruff, ty, import-linter, test]
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - image-name: app
            dockerfile: Dockerfile
            tag: fastapi-template:ci-app
          - image-name: migration
            dockerfile: Dockerfile.migration
            tag: fastapi-template:ci-migration

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build ${{ matrix.image-name }} Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          tags: ${{ matrix.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true

      - name: Scan ${{ matrix.image-name }} image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ matrix.tag }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL

  e2e:
    name: Scenario tests
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      contents: read
    env:
      TARGET_BASE_URL: http://localhost
      COMPOSE_FILE: docker-compose.yml:docker-compose.e2e.yml
      TOKEN_URL: http://localhost:8080/realms/fastapi-e2e-realm/protocol/openid-connect/token
      POSTGRES_PASSWORD: postgres
      KEYCLOAK_ADMIN_PASSWORD: admin
      OIDC_CLIENT_ID: fastapi-client
      OIDC_CLIENT_SECRET: change-me
      E2E_USERNAME: e2e-user
      E2E_PASSWORD: test-password

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Install Python
        run: uv python install

      - name: Start Docker Compose stack
        run: docker compose up --build --wait --wait-timeout 240

      - name: Install Scenario Tests dependencies
        run: uv sync --locked --no-build --package scenario-tests

      - name: Run scenario tests
        working-directory: scenario-tests
        run: uv run --locked --no-build behave

      - name: Show Docker Compose logs
        if: failure()
        run: docker compose logs

      - name: Stop Docker Compose stack
        if: always()
        run: docker compose down --volumes --remove-orphans

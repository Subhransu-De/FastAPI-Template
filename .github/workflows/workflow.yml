name: CI/CD

on:
  push:
    paths:
      - "**.py"
      - "**.ini"
      - "**.toml"
      - "**.lock"
      - ".importlinter"
      - "Dockerfile*"
      - "Makefile"
      - "docker-compose*.yml"
      - ".docker/**"
      - "scenario-tests/**"
      - "renovate.json"
      - "sonar-project.properties"
      - ".sonarcloud.properties"
      - ".github/dependabot.yml"
      - ".github/workflows/**.yml"
  pull_request:
    paths:
      - "**.py"
      - "**.ini"
      - "**.toml"
      - "**.lock"
      - ".importlinter"
      - "Dockerfile*"
      - "Makefile"
      - "docker-compose*.yml"
      - ".docker/**"
      - "scenario-tests/**"
      - "renovate.json"
      - "sonar-project.properties"
      - ".sonarcloud.properties"
      - ".github/dependabot.yml"
      - ".github/workflows/**.yml"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  ruff:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2

      - name: Install lint dependencies
        run: uv sync --group lint --all-packages

      - name: Run Ruff
        run: make lint-ruff

  ty:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2

      - name: Install lint and test dependencies
        run: uv sync --group lint --group test --all-packages

      - name: Run Ty
        run: make lint-ty

  import-linter:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2

      - name: Install lint dependencies
        run: uv sync --group lint --all-packages

      - name: Run Import Linter
        run: make lint-imports

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2

      - name: Install Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --python ${{ matrix.python-version }} --group test

      - name: Run unit tests
        run: uv run --python ${{ matrix.python-version }} --group test pytest -m unit

      - name: Run integration tests
        run: uv run --python ${{ matrix.python-version }} --group test pytest -m integration

      - name: Run tests with coverage
        run: uv run --python ${{ matrix.python-version }} pytest --cov=app --cov-report=term-missing --cov-fail-under=80

  build:
    runs-on: ubuntu-latest
    needs: [ruff, ty, import-linter, test]
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - image-name: app
            dockerfile: Dockerfile
            tag: fastapi-template:ci-app
          - image-name: migration
            dockerfile: Dockerfile.migration
            tag: fastapi-template:ci-migration

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build ${{ matrix.image-name }} Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          tags: ${{ matrix.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  e2e:
    name: Scenario tests
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      contents: read
    env:
      TARGET_BASE_URL: http://localhost
      COMPOSE_FILE: docker-compose.yml:docker-compose.e2e.yml
      TOKEN_URL: http://localhost:8080/realms/fastapi-e2e-realm/protocol/openid-connect/token
      POSTGRES_PASSWORD: postgres
      KEYCLOAK_ADMIN_PASSWORD: admin
      OIDC_CLIENT_ID: fastapi-client
      OIDC_CLIENT_SECRET: change-me
      E2E_USERNAME: e2e-user
      E2E_PASSWORD: test-password

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2

      - name: Install Python
        run: uv python install

      - name: Start Docker Compose stack
        run: docker compose up --build --wait --wait-timeout 240

      - name: Install Scenario Tests dependencies
        run: uv sync --package scenario-tests

      - name: Run scenario tests
        working-directory: scenario-tests
        run: uv run behave

      - name: Show Docker Compose logs
        if: failure()
        run: docker compose logs

      - name: Stop Docker Compose stack
        if: always()
        run: docker compose down --volumes --remove-orphans

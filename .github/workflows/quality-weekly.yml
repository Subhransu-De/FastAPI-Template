name: Weekly quality

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutation-testing:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Install Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --locked --no-build --group test

      - name: Run mutation testing
        run: uv run --locked --no-build --with mutmut mutmut run

      - name: Summarize surviving mutants
        if: always()
        run: uv run --locked --no-build --with mutmut mutmut results | tee mutmut-results.txt

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutmut-results
          path: |
            mutmut-results.txt
            mutants/
          if-no-files-found: ignore

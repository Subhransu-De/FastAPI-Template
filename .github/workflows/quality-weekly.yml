name: Weekly quality

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutation-testing:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Install Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --locked --no-build --group test

      - name: Run mutation testing
        run: uv run --locked --with mutmut mutmut run

      - name: Summarize surviving mutants
        if: always()
        run: uv run --locked --with mutmut mutmut results | tee mutmut-results.txt

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutmut-results
          path: |
            mutmut-results.txt
            mutants/
          if-no-files-found: ignore

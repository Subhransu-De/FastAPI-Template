name: Terraform

on:
  push:
    paths:
      - "infra/**"
      - ".github/dependabot.yml"
      - ".github/workflows/terraform.yml"
  pull_request:
    paths:
      - "infra/**"
      - ".github/dependabot.yml"
      - ".github/workflows/terraform.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint Terraform
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up TFLint
        uses: terraform-linters/setup-tflint@6e1e0642c0289bd619021bf6b34e3c08ed1e005a # v6.3.0
        with:
          tflint_version: "v0.64.0"

      - name: Initialize TFLint plugins
        working-directory: infra
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: tflint --init --config="$GITHUB_WORKSPACE/infra/.tflint.hcl"

      - name: Lint all Terraform roots
        working-directory: infra
        run: tflint --recursive --config="$GITHUB_WORKSPACE/infra/.tflint.hcl" --format=compact

  discover:
    name: Discover Terraform roots
    runs-on: ubuntu-latest
    outputs:
      directories: ${{ steps.configurations.outputs.directories }}
      has-configurations: ${{ steps.configurations.outputs.has-configurations }}

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Find independent Terraform roots
        id: configurations
        shell: bash
        run: |
          mapfile -t directories < <(
            find infra -mindepth 2 -maxdepth 2 -type f -name terraform.tf \
              -printf '%h\n' | sort -u
          )

          if (( ${#directories[@]} == 0 )); then
            echo 'directories=[]' >> "$GITHUB_OUTPUT"
            echo 'has-configurations=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          printf 'directories=%s\n' "$(printf '%s\n' "${directories[@]}" | jq -Rsc 'split("\n")[:-1]')" >> "$GITHUB_OUTPUT"
          echo 'has-configurations=true' >> "$GITHUB_OUTPUT"

  validate:
    name: Validate ${{ matrix.directory }}
    if: needs.discover.outputs.has-configurations == 'true'
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        directory: ${{ fromJSON(needs.discover.outputs.directories) }}

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.15.8"

      - name: Check Terraform formatting
        run: terraform -chdir="${{ matrix.directory }}" fmt -check -recursive

      - name: Initialize Terraform without a backend
        run: terraform -chdir="${{ matrix.directory }}" init -backend=false -input=false

      - name: Validate Terraform
        run: terraform -chdir="${{ matrix.directory }}" validate

      - name: Scan Terraform configuration
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: ${{ matrix.directory }}
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL

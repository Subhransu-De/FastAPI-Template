services:
  keycloak:
    volumes:
      - ./.docker/e2e-realm-export.json:/opt/keycloak/data/import/e2e-realm-export.json

  keycloak-config:
    environment:
      OIDC_REALM: fastapi-e2e-realm
      OIDC_BOOTSTRAP_USERNAME: e2e-user

  app:
    environment:
      OIDC_ISSUER_URL: ${OIDC_PUBLIC_URL:-http://localhost:8080}/realms/fastapi-e2e-realm
      OIDC_INTERNAL_URL: http://keycloak:8080/realms/fastapi-e2e-realm

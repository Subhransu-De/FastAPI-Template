x-app-image: &app-image
  image: ${APP_IMAGE:-${COMPOSE_PROJECT_NAME:-fastapi-template}-app:local}
  build:
    context: .
    dockerfile: ${APP_DOCKERFILE:-Dockerfile}

x-migration-image: &migration-image
  image: ${MIGRATION_IMAGE:-${COMPOSE_PROJECT_NAME:-fastapi-template}-migration:local}
  build:
    context: .
    dockerfile: ${MIGRATION_DOCKERFILE:-Dockerfile.migration}

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: fastapi_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - fastapi_template_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:26.7
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD is required}
      KC_HTTP_PORT: 8080
      KC_HOSTNAME: ${OIDC_PUBLIC_URL:-http://localhost:8080}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./.docker/realm-export.json:/opt/keycloak/data/import/realm-export.json
    ports:
      - "${KEYCLOAK_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && printf 'GET /health/ready HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3 && cat <&3 | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  keycloak-config:
    <<: *app-image
    network_mode: "service:keycloak"
    entrypoint: ["python", "/config/configure_keycloak_client.py"]
    environment:
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD is required}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost}
      OIDC_REALM: fastapi-realm
      OIDC_DOCS_CLIENT_ID: fastapi-docs
      OIDC_API_CLIENT_ID: fastapi-client
      OIDC_API_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-change-me}
      OIDC_BOOTSTRAP_USERNAME: testuser
    volumes:
      - ./.docker/configure_keycloak_client.py:/config/configure_keycloak_client.py:ro
    depends_on:
      keycloak:
        condition: service_healthy
    restart: "no"

  migrate:
    <<: *migration-image
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/fastapi_db
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    <<: *app-image
    ports:
      - "${APP_PORT:-80}:80"
    environment:
      APP_HOST: 0.0.0.0
      DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/fastapi_db
      OIDC_ISSUER_URL: ${OIDC_PUBLIC_URL:-http://localhost:8080}/realms/fastapi-realm
      OIDC_INTERNAL_URL: http://keycloak:8080/realms/fastapi-realm
      OIDC_CLIENT_ID: fastapi-client
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-change-me}
      OIDC_DOCS_CLIENT_ID: fastapi-docs
      OIDC_AUTHORIZATION_RESOURCE: FastAPI API
      OIDC_AUTHORIZATION_TIMEOUT_SECONDS: 5
      OIDC_JWKS_CACHE_TTL_SECONDS: 300
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy
      keycloak-config:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  fastapi_template_postgres_data:

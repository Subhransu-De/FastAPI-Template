[project]
name = "fastapi-template"
version = "0.1.0"
description = "An opinionated FastAPI template with async SQLAlchemy 2.0, Alembic migrations, Pydantic v2, uv package manager, Docker, pytest, and pre-configured CI/CD. Python 3.13+ boilerplate for building REST APIs."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "logfire[fastapi,psycopg,sqlalchemy]>=5.1.1",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyjwt[crypto]>=2.15.1",
    "sqlalchemy[asyncio]>=2.1.3",
    "uvicorn>=0.54.0",
]

[dependency-groups]
migration = [
    "alembic[tz]>=1.20.0",
    "psycopg[binary]>=3.3.6",
]
lint = [
    "import-linter>=2.15",
    "ruff>=0.16.10",
    "ty>=0.0.84",
]
test = [
    { include-group = "migration" },
    "pytest>=9.1.1",
    "anyio>=4.15.1",
    "httpx>=0.28.1",
    "aiosqlite>=0.22.1",
    "pytest-cov>=7.1.0",
    "pytest-httpserver>=1.1.3",
    "testcontainers[postgres]>=4.15.0",
    "asgi-lifespan>=2.1.0",
    "pytest-randomly>=3.16",
    "pytest-timeout>=2.4",
    "hypothesis>=6.168.4",
]

[tool.uv.workspace]
members = ["scenario-tests"]

[tool.alembic]
script_location = "%(here)s/alembic"
timezone = "UTC"
file_template = "%%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s"
prepend_sys_path = ["."]
version_locations = [
   "%(here)s/alembic/versions"
]
output_encoding = "utf-8"

[[tool.alembic.post_write_hooks]]
name = "ruff"
type = "exec"
executable = "ruff"
options = "check --fix REVISION_SCRIPT_FILENAME"
[tool.pytest.ini_options]
testpaths = ["tests"]
anyio_mode = "auto"
markers = [
    "unit: fast, no external deps",
    "integration: tests that use disposable Postgres via Testcontainers",
    "with_auth: inject a signed Bearer token into every request made by the test",
]
addopts = "-v --strict-markers"
timeout = 30
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
show_missing = true
fail_under = 90
exclude_also = [
    "^\\s*\\.\\.\\.$",
]

[tool.mutmut]
source_paths = [
    "app/auth",
    "app/io",
    "app/service",
    "app/repository",
]
also_copy = [
    "app/__init__.py",
    "app/main.py",
    "app/telemetry.py",
    "app/database/",
    "app/exceptions/",
    "app/logger/",
    "app/model/",
    "app/routes/",
    "app/settings/",
    "alembic/",
    "alembic.ini",
]
pytest_add_cli_args_test_selection = [
    "tests/unit/auth",
    "tests/unit/io",
    "tests/unit/service",
    "tests/integration/test_entities_api.py",
    "tests/integration/test_repository.py",
]
